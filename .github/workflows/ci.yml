name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decision_ledger_test
          POSTGRES_USER: ledger_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger_user -d decision_ledger_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: decision_ledger_test
      DB_USER: ledger_user
      DB_PASSWORD: test_password
      API_KEY: test-secret-key
      TEST_DATABASE_URL: postgresql+asyncpg://ledger_user:test_password@localhost:5432/decision_ledger_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Lint with ruff
        run: ruff check api/ tests/ dashboard/

      - name: Apply schema to test database
        run: |
          PGPASSWORD=test_password psql \
            -h localhost -U ledger_user -d decision_ledger_test \
            -f db/schema.sql
          PGPASSWORD=test_password psql \
            -h localhost -U ledger_user -d decision_ledger_test \
            -f db/views.sql

      - name: Run tests
        run: pytest tests/ -v --tb=short
